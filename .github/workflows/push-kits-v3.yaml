name: Publish Kits (v3)

# v3 counterpart to push-kits.yaml. The v3 kits are ordinary OCI images built
# with docker buildx: the frontend (pulled from each descriptor's
# `# syntax=docker/sandbox-kit:3` line) validates the descriptor during the
# build, so the validate job needs no extra tooling. Publishing runs
# scripts/push-kits-v3.sh on manual dispatch.

on:
  pull_request:
    paths:
      - "v3/**"
      - "scripts/push-kits-v3.sh"
      - ".github/workflows/push-kits-v3.yaml"
  push:
    branches: [main]
    paths:
      - "v3/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to Docker Hub (otherwise validate/build only)"
        type: boolean
        required: false
        default: false

jobs:
  # Build all three flavors. The kit frontend validates each descriptor as part
  # of the build, so a bad field fails here. No push — PRs and pushes only prove
  # the kits build.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (validate) all three v3 kits
        run: PUSH=0 bash ./scripts/push-kits-v3.sh

  # Push to Docker Hub. Manual dispatch only, and only when `publish` is true.
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push all three v3 kits
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'mem0' }}
        run: PUSH=1 bash ./scripts/push-kits-v3.sh
